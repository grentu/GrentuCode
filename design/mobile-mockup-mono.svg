<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960" font-family="Inter, DejaVu Sans, sans-serif">
  <rect width="900" height="960" fill="#0a0a0a"/>
  <text x="40" y="44" fill="#f5f5f5" font-size="20" font-weight="700">Мобильный лейаут: три колонки → табы снизу</text>
  <text x="40" y="68" fill="#7a7a7a" font-size="13">боковые панели (агенты, работа) сворачиваются в отдельные вкладки, чат в центре по умолчанию</text>

  <!-- ============ PHONE A: ЧАТ ============ -->
  <rect x="40" y="90" width="380" height="840" rx="40" fill="#000000" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="185" y="104" width="90" height="10" rx="5" fill="#1a1a1a"/>
  <!-- top bar -->
  <text x="66" y="150" fill="#e5e5e5" font-size="18">≡</text>
  <text x="86" y="150" fill="#8a8a8a" font-size="11">агенты</text>
  <text x="230" y="150" fill="#f5f5f5" font-size="14" font-weight="700" text-anchor="middle">GrentuCode</text>
  <text x="360" y="150" fill="#8a8a8a" font-size="11" text-anchor="end">работа</text>
  <text x="392" y="150" fill="#e5e5e5" font-size="16" text-anchor="end">▦</text>
  <rect x="56" y="166" width="348" height="1" fill="#1e1e1e"/>

  <text x="66" y="196" fill="#c8c8c8" font-size="12" font-weight="600">Задача: foo + bar</text>
  <text x="66" y="214" fill="#6a6a6a" font-size="10.5">оркестратор ведёт · 2 пары</text>

  <!-- messages -->
  <rect x="66" y="230" width="96" height="30" rx="9" fill="#1f1f1f"/>
  <text x="80" y="250" fill="#f0f0f0" font-size="12">привет</text>

  <text x="66" y="286" fill="#c8c8c8" font-size="10" font-weight="600">Оркестратор</text>
  <rect x="66" y="292" width="270" height="30" rx="9" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="80" y="312" fill="#e5e5e5" font-size="12">привет. готов принять задачу</text>

  <rect x="176" y="336" width="160" height="30" rx="9" fill="#1f1f1f"/>
  <text x="190" y="356" fill="#f0f0f0" font-size="12">добавьте foo и bar</text>

  <text x="66" y="398" fill="#c8c8c8" font-size="10" font-weight="600">Оркестратор · режет</text>
  <rect x="66" y="404" width="288" height="46" rx="9" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="80" y="424" fill="#e5e5e5" font-size="12">2 куска: Пара 1 → foo, Пара 2 → bar</text>
  <text x="80" y="441" fill="#b0b0b0" font-size="12">контракт заморожен</text>

  <!-- consultation collapsed into a chip -->
  <rect x="66" y="464" width="288" height="40" rx="10" fill="#0d0d0d" stroke="#242424" stroke-width="1"/>
  <text x="80" y="481" fill="#8a8a8a" font-size="10.5" font-weight="600">СОВЕЩАНИЕ · Пара 1</text>
  <text x="80" y="497" fill="#b8b8b8" font-size="11">3 реплики · нажми, чтобы раскрыть</text>
  <text x="338" y="490" fill="#c8c8c8" font-size="15" text-anchor="end">›</text>

  <!-- input -->
  <rect x="66" y="792" width="248" height="36" rx="11" fill="#0f0f0f" stroke="#242424" stroke-width="1"/>
  <text x="80" y="815" fill="#5a5a5a" font-size="11.5">Сообщение...</text>
  <rect x="322" y="796" width="32" height="28" rx="8" fill="#ffffff"/>
  <text x="338" y="815" fill="#000000" font-size="12" font-weight="700" text-anchor="middle">↑</text>

  <!-- bottom tab bar -->
  <rect x="56" y="846" width="348" height="1" fill="#1e1e1e"/>
  <text x="120" y="884" fill="#6a6a6a" font-size="11" text-anchor="middle">Агенты</text>
  <text x="230" y="884" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Чат</text>
  <rect x="210" y="894" width="40" height="2" rx="1" fill="#ffffff"/>
  <text x="340" y="884" fill="#6a6a6a" font-size="11" text-anchor="middle">Работа</text>
  <text x="230" y="922" fill="#5a5a5a" font-size="11" text-anchor="middle">вкладка «Чат» (по умолчанию)</text>

  <!-- ============ PHONE B: РАБОТА ============ -->
  <rect x="480" y="90" width="380" height="840" rx="40" fill="#000000" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="625" y="104" width="90" height="10" rx="5" fill="#1a1a1a"/>
  <text x="506" y="150" fill="#e5e5e5" font-size="18">≡</text>
  <text x="526" y="150" fill="#8a8a8a" font-size="11">агенты</text>
  <text x="670" y="150" fill="#f5f5f5" font-size="14" font-weight="700" text-anchor="middle">Работа</text>
  <text x="832" y="150" fill="#e5e5e5" font-size="16" text-anchor="end">▦</text>
  <rect x="496" y="166" width="348" height="1" fill="#1e1e1e"/>

  <!-- план -->
  <rect x="506" y="182" width="328" height="70" rx="10" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="522" y="204" fill="#f0f0f0" font-size="12" font-weight="700">План</text>
  <circle cx="526" cy="226" r="3.5" fill="#ffffff"/>
  <text x="538" y="230" fill="#d8d8d8" font-size="11">chunk-a · foo · A</text>
  <text x="820" y="230" fill="#c8c8c8" font-size="10" text-anchor="end">пройдено</text>
  <circle cx="522" cy="244" r="1.8" fill="#c8c8c8"/><circle cx="527" cy="244" r="1.8" fill="#c8c8c8"/><circle cx="532" cy="244" r="1.8" fill="#c8c8c8"/>
  <text x="540" y="248" fill="#d8d8d8" font-size="11">chunk-b · bar · B</text>
  <text x="820" y="248" fill="#c8c8c8" font-size="10" text-anchor="end">чинится</text>

  <!-- контракт -->
  <rect x="506" y="264" width="328" height="64" rx="10" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="522" y="286" fill="#f0f0f0" font-size="12" font-weight="700">Контракт</text>
  <rect x="726" y="272" width="100" height="20" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
  <text x="776" y="286" fill="#e5e5e5" font-size="10" text-anchor="middle">v3 · история ⟲</text>
  <text x="522" y="308" fill="#d8d8d8" font-size="11">clause-a · foo(): string</text>
  <text x="522" y="323" fill="#d8d8d8" font-size="11">clause-b · bar(): number</text>

  <!-- тесты -->
  <rect x="506" y="340" width="328" height="120" rx="10" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="522" y="362" fill="#f0f0f0" font-size="12" font-weight="700">Тесты</text>
  <text x="820" y="362" fill="#e5e5e5" font-size="11" text-anchor="end" font-weight="600">3 / 4</text>
  <rect x="522" y="370" width="304" height="7" rx="3.5" fill="#1c1c1c"/>
  <rect x="522" y="370" width="228" height="7" rx="3.5" fill="#e0e0e0"/>
  <text x="524" y="398" fill="#9a9a9a" font-size="12" font-weight="700">✓</text>
  <text x="540" y="398" fill="#c8c8c8" font-size="11">contract-a · пройден</text>
  <text x="524" y="416" fill="#9a9a9a" font-size="12" font-weight="700">✓</text>
  <text x="540" y="416" fill="#c8c8c8" font-size="11">logic-a · пройден</text>
  <rect x="516" y="426" width="308" height="24" rx="6" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.2"/>
  <text x="524" y="443" fill="#ffffff" font-size="12" font-weight="700">✕</text>
  <text x="540" y="443" fill="#ffffff" font-size="11" font-weight="600">logic-b · НЕ ПРОЙДЕН → ретрай B</text>

  <!-- бюджеты -->
  <rect x="506" y="472" width="328" height="118" rx="10" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="522" y="494" fill="#f0f0f0" font-size="12" font-weight="700">Бюджеты · по куску</text>
  <text x="522" y="518" fill="#b8b8b8" font-size="11">K-a · Автор A</text>
  <rect x="660" y="510" width="130" height="8" rx="4" fill="#1c1c1c"/>
  <text x="820" y="518" fill="#7a7a7a" font-size="10" text-anchor="end">0 / 3</text>
  <text x="522" y="540" fill="#e5e5e5" font-size="11" font-weight="600">K-b · Автор B</text>
  <rect x="660" y="532" width="130" height="8" rx="4" fill="#1c1c1c"/>
  <rect x="660" y="532" width="43" height="8" rx="4" fill="#ffffff"/>
  <text x="820" y="540" fill="#e5e5e5" font-size="10" text-anchor="end" font-weight="600">1 / 3</text>
  <text x="522" y="562" fill="#b8b8b8" font-size="11">M · replan</text>
  <rect x="660" y="554" width="130" height="8" rx="4" fill="#1c1c1c"/>
  <text x="820" y="562" fill="#7a7a7a" font-size="10" text-anchor="end">0 / 2</text>
  <text x="522" y="584" fill="#b8b8b8" font-size="11">P · приёмка</text>
  <rect x="660" y="576" width="130" height="8" rx="4" fill="#1c1c1c"/>
  <text x="820" y="584" fill="#7a7a7a" font-size="10" text-anchor="end">0 / 3</text>

  <!-- статус -->
  <rect x="506" y="602" width="328" height="58" rx="10" fill="#0e0e0e" stroke="#333333" stroke-width="1"/>
  <circle cx="528" cy="631" r="7" fill="#ffffff"/>
  <text x="544" y="627" fill="#f0f0f0" font-size="12" font-weight="700">Чинится, в рамках бюджета</text>
  <text x="544" y="645" fill="#b8b8b8" font-size="10.5">Автор B правит (K-b 1/3). Эскалация не нужна.</text>

  <!-- bottom tabs -->
  <rect x="496" y="846" width="348" height="1" fill="#1e1e1e"/>
  <text x="560" y="884" fill="#6a6a6a" font-size="11" text-anchor="middle">Агенты</text>
  <text x="670" y="884" fill="#6a6a6a" font-size="11" text-anchor="middle">Чат</text>
  <text x="780" y="884" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Работа</text>
  <rect x="758" y="894" width="44" height="2" rx="1" fill="#ffffff"/>
  <text x="670" y="922" fill="#5a5a5a" font-size="11" text-anchor="middle">вкладка «Работа» (правая панель на весь экран)</text>
</svg>
