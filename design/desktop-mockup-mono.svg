<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, DejaVu Sans, sans-serif">
  <rect width="1440" height="900" fill="#000000"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="56" fill="#0b0b0b"/>
  <rect x="0" y="55" width="1440" height="1" fill="#242424"/>
  <circle cx="24" cy="28" r="6" fill="#3a3a3a"/>
  <circle cx="42" cy="28" r="6" fill="#3a3a3a"/>
  <circle cx="60" cy="28" r="6" fill="#3a3a3a"/>
  <text x="92" y="34" fill="#f5f5f5" font-size="18" font-weight="700">GrentuCode</text>
  <text x="214" y="34" fill="#7a7a7a" font-size="13">мессенджер для нейросетей</text>
  <!-- run status pill -->
  <rect x="1150" y="15" width="150" height="26" rx="13" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="1168" cy="28" r="4" fill="#ffffff"/>
  <text x="1180" y="32" fill="#e5e5e5" font-size="12" font-weight="600">выполняется</text>
  <!-- model chip -->
  <rect x="1312" y="15" width="112" height="26" rx="13" fill="#111111" stroke="#2c2c2c" stroke-width="1"/>
  <text x="1368" y="32" fill="#c8c8c8" font-size="12" text-anchor="middle">6 агентов</text>

  <!-- ============ LEFT RAIL: AGENTS ============ -->
  <rect x="0" y="56" width="250" height="844" fill="#080808"/>
  <rect x="249" y="56" width="1" height="844" fill="#242424"/>
  <text x="20" y="92" fill="#f5f5f5" font-size="14" font-weight="700">Агенты</text>
  <text x="230" y="92" fill="#5a5a5a" font-size="12" text-anchor="end">ростер</text>

  <!-- group: ведущие -->
  <text x="20" y="120" fill="#5a5a5a" font-size="11" font-weight="600" letter-spacing="1">ВЕДУЩИЕ</text>
  <!-- Оркестратор -->
  <circle cx="34" cy="146" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="151" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">О</text>
  <text x="58" y="143" fill="#e8e8e8" font-size="13" font-weight="600">Оркестратор</text>
  <text x="58" y="159" fill="#7a7a7a" font-size="11">планирует, режет задачу</text>
  <circle cx="236" cy="146" r="4" fill="#ffffff"/>
  <!-- План-критик -->
  <circle cx="34" cy="188" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="193" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">П</text>
  <text x="58" y="185" fill="#e8e8e8" font-size="13" font-weight="600">План-критик</text>
  <text x="58" y="201" fill="#7a7a7a" font-size="11">ревью нарезки</text>
  <circle cx="236" cy="188" r="4" fill="#2f2f2f"/>
  <!-- Приёмка -->
  <circle cx="34" cy="230" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="235" fill="#f5f5f5" font-size="12" font-weight="700" text-anchor="middle">Пр</text>
  <text x="58" y="227" fill="#e8e8e8" font-size="13" font-weight="600">Приёмка</text>
  <text x="58" y="243" fill="#7a7a7a" font-size="11">последний фильтр смысла</text>
  <circle cx="236" cy="230" r="4" fill="#2f2f2f"/>

  <!-- group: Пара 1 -->
  <text x="20" y="284" fill="#5a5a5a" font-size="11" font-weight="600" letter-spacing="1">ПАРА 1 · модуль foo</text>
  <circle cx="34" cy="310" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="315" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="58" y="307" fill="#e8e8e8" font-size="13" font-weight="600">Автор A</text>
  <text x="58" y="323" fill="#7a7a7a" font-size="11">пишет src/foo.ts</text>
  <circle cx="236" cy="310" r="4" fill="#ffffff"/>
  <circle cx="34" cy="352" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="357" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">К</text>
  <text x="58" y="349" fill="#e8e8e8" font-size="13" font-weight="600">Логик-критик A</text>
  <text x="58" y="365" fill="#7a7a7a" font-size="11">совещается с A</text>
  <circle cx="236" cy="352" r="4" fill="#9a9a9a"/>

  <!-- group: Пара 2 -->
  <text x="20" y="406" fill="#5a5a5a" font-size="11" font-weight="600" letter-spacing="1">ПАРА 2 · модуль bar</text>
  <circle cx="34" cy="432" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="437" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="58" y="429" fill="#e8e8e8" font-size="13" font-weight="600">Автор B</text>
  <text x="58" y="445" fill="#7a7a7a" font-size="11">пишет src/bar.ts</text>
  <circle cx="236" cy="432" r="4" fill="#ffffff"/>
  <circle cx="34" cy="474" r="14" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="34" y="479" fill="#f5f5f5" font-size="13" font-weight="700" text-anchor="middle">К</text>
  <text x="58" y="471" fill="#e8e8e8" font-size="13" font-weight="600">Логик-критик B</text>
  <text x="58" y="487" fill="#7a7a7a" font-size="11">ждёт код B</text>
  <circle cx="236" cy="474" r="4" fill="#2f2f2f"/>

  <!-- add agent ghost button -->
  <rect x="20" y="840" width="210" height="38" rx="10" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="864" fill="#7a7a7a" font-size="13" text-anchor="middle">+ добавить агента</text>

  <!-- ============ CENTER: CHAT ============ -->
  <rect x="250" y="56" width="670" height="844" fill="#000000"/>
  <!-- chat header -->
  <text x="274" y="92" fill="#f5f5f5" font-size="14" font-weight="700">Задача: добавить модули foo и bar и связать их</text>
  <text x="274" y="112" fill="#7a7a7a" font-size="12">оркестратор ведёт · 2 пары работают параллельно</text>
  <rect x="250" y="128" width="670" height="1" fill="#1c1c1c"/>

  <!-- message: user привет -->
  <text x="274" y="160" fill="#5a5a5a" font-size="11">Вы · 12:04</text>
  <rect x="274" y="168" width="120" height="34" rx="10" fill="#1f1f1f"/>
  <text x="290" y="190" fill="#f0f0f0" font-size="13">привет</text>

  <!-- nets reply привет -->
  <text x="274" y="228" fill="#c8c8c8" font-size="11" font-weight="600">Оркестратор</text>
  <rect x="274" y="236" width="320" height="34" rx="10" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="290" y="258" fill="#e5e5e5" font-size="13">привет. готов принять задачу</text>
  <rect x="606" y="236" width="66" height="34" rx="10" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="622" y="258" fill="#c8c8c8" font-size="13">A: тут</text>
  <rect x="684" y="236" width="70" height="34" rx="10" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="700" y="258" fill="#c8c8c8" font-size="13">B: тут</text>

  <!-- user task -->
  <text x="274" y="300" fill="#5a5a5a" font-size="11">Вы · 12:05</text>
  <rect x="274" y="308" width="360" height="34" rx="10" fill="#1f1f1f"/>
  <text x="290" y="330" fill="#f0f0f0" font-size="13">добавьте foo и bar и свяжите их</text>

  <!-- orchestrator plan -->
  <text x="274" y="368" fill="#c8c8c8" font-size="11" font-weight="600">Оркестратор · режет задачу</text>
  <rect x="274" y="376" width="470" height="56" rx="10" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  <text x="290" y="399" fill="#e5e5e5" font-size="13">режу на 2 куска. Пара 1 → foo, Пара 2 → bar.</text>
  <text x="290" y="418" fill="#b0b0b0" font-size="13">контракт заморожен, файлы не пересекаются</text>

  <!-- consultation block (пара 1 совещается) -->
  <rect x="274" y="448" width="470" height="118" rx="12" fill="#080808" stroke="#242424" stroke-width="1"/>
  <text x="290" y="472" fill="#8a8a8a" font-size="11" font-weight="600">СОВЕЩАНИЕ · Пара 1 (внутри, юзеру виден итог)</text>
  <circle cx="298" cy="496" r="9" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="298" y="500" fill="#e5e5e5" font-size="10" font-weight="700" text-anchor="middle">К</text>
  <text x="316" y="500" fill="#b8b8b8" font-size="12.5">Логик-критик A: по foo верни строку, не число</text>
  <circle cx="298" cy="524" r="9" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="298" y="528" fill="#e5e5e5" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <text x="316" y="528" fill="#b8b8b8" font-size="12.5">Автор A: принял, правлю сигнатуру foo(): string</text>
  <circle cx="298" cy="550" r="9" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
  <text x="298" y="554" fill="#e5e5e5" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <text x="316" y="554" fill="#b8b8b8" font-size="12.5">Автор A: готово, тесты стыка зелёные</text>

  <!-- input bar -->
  <rect x="274" y="838" width="622" height="44" rx="12" fill="#0f0f0f" stroke="#242424" stroke-width="1"/>
  <text x="292" y="865" fill="#5a5a5a" font-size="13">Напишите задачу или сообщение...</text>
  <rect x="838" y="846" width="50" height="28" rx="8" fill="#ffffff"/>
  <text x="863" y="865" fill="#000000" font-size="12" font-weight="700" text-anchor="middle">↑</text>

  <!-- ============ RIGHT RAIL: WORK ============ -->
  <rect x="920" y="56" width="520" height="844" fill="#080808"/>
  <rect x="920" y="56" width="1" height="844" fill="#242424"/>
  <text x="944" y="92" fill="#f5f5f5" font-size="14" font-weight="700">Работа</text>
  <text x="1416" y="92" fill="#5a5a5a" font-size="12" text-anchor="end">состояние прогона</text>

  <!-- card: план -->
  <rect x="944" y="108" width="472" height="118" rx="12" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="964" y="132" fill="#f0f0f0" font-size="13" font-weight="700">План</text>
  <rect x="964" y="146" width="432" height="30" rx="8" fill="#141414"/>
  <circle cx="982" cy="161" r="4" fill="#ffffff"/>
  <text x="996" y="165" fill="#e5e5e5" font-size="12.5">chunk-a · foo · Автор A</text>
  <text x="1380" y="165" fill="#c8c8c8" font-size="11" text-anchor="end">в работе</text>
  <rect x="964" y="182" width="432" height="30" rx="8" fill="#141414"/>
  <circle cx="982" cy="197" r="4" fill="#5a5a5a"/>
  <text x="996" y="201" fill="#e5e5e5" font-size="12.5">chunk-b · bar · Автор B</text>
  <text x="1380" y="201" fill="#7a7a7a" font-size="11" text-anchor="end">ждёт</text>

  <!-- card: контракт -->
  <rect x="944" y="242" width="472" height="118" rx="12" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="964" y="266" fill="#f0f0f0" font-size="13" font-weight="700">Контракт · spec.md</text>
  <rect x="1330" y="252" width="86" height="22" rx="11" fill="#000000" stroke="#3a3a3a" stroke-width="1"/>
  <text x="1373" y="267" fill="#c8c8c8" font-size="11" text-anchor="middle">заморожен</text>
  <text x="964" y="292" fill="#e5e5e5" font-size="12.5">clause-a  ·  foo(): string</text>
  <text x="964" y="314" fill="#e5e5e5" font-size="12.5">clause-b  ·  bar(): number</text>
  <text x="964" y="340" fill="#7a7a7a" font-size="11.5">пишет только оркестратор, авторы не трогают</text>

  <!-- card: тесты -->
  <rect x="944" y="376" width="472" height="104" rx="12" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="964" y="400" fill="#f0f0f0" font-size="13" font-weight="700">Тесты · интеграция + стыки</text>
  <text x="1416" y="400" fill="#e5e5e5" font-size="12" text-anchor="end" font-weight="600">3 / 4</text>
  <rect x="964" y="414" width="452" height="10" rx="5" fill="#1c1c1c"/>
  <rect x="964" y="414" width="339" height="10" rx="5" fill="#e0e0e0"/>
  <text x="964" y="446" fill="#b8b8b8" font-size="12">contract-a пройден · contract-b пройден</text>
  <text x="964" y="466" fill="#b8b8b8" font-size="12">logic-a пройден · logic-b гоняется...</text>

  <!-- card: бюджеты -->
  <rect x="944" y="496" width="472" height="130" rx="12" fill="#0e0e0e" stroke="#242424" stroke-width="1"/>
  <text x="964" y="520" fill="#f0f0f0" font-size="13" font-weight="700">Бюджеты · предохранители</text>
  <!-- K -->
  <text x="964" y="548" fill="#b8b8b8" font-size="12">K · ретраи автора</text>
  <rect x="1120" y="539" width="240" height="10" rx="5" fill="#1c1c1c"/>
  <rect x="1120" y="539" width="80" height="10" rx="5" fill="#9a9a9a"/>
  <text x="1416" y="548" fill="#7a7a7a" font-size="11" text-anchor="end">1 / 3</text>
  <!-- M -->
  <text x="964" y="576" fill="#b8b8b8" font-size="12">M · replan</text>
  <rect x="1120" y="567" width="240" height="10" rx="5" fill="#1c1c1c"/>
  <text x="1416" y="576" fill="#7a7a7a" font-size="11" text-anchor="end">0 / 2</text>
  <!-- P -->
  <text x="964" y="604" fill="#b8b8b8" font-size="12">P · завороты приёмки</text>
  <rect x="1120" y="595" width="240" height="10" rx="5" fill="#1c1c1c"/>
  <text x="1416" y="604" fill="#7a7a7a" font-size="11" text-anchor="end">0 / 3</text>

  <!-- card: статус / эскалация -->
  <rect x="944" y="642" width="472" height="72" rx="12" fill="#0e0e0e" stroke="#333333" stroke-width="1"/>
  <circle cx="972" cy="678" r="8" fill="#ffffff"/>
  <text x="990" y="674" fill="#f0f0f0" font-size="13" font-weight="700">Под контролем</text>
  <text x="990" y="694" fill="#b8b8b8" font-size="12">бюджеты не исчерпаны, эскалация к человеку не нужна</text>

  <!-- footer note -->
  <text x="944" y="746" fill="#5a5a5a" font-size="11.5">Правая панель это UI поверх ядра v4: план, замороженный контракт,</text>
  <text x="944" y="764" fill="#5a5a5a" font-size="11.5">контрактные тесты и бюджеты K/M/P с эскалацией. Всё уже есть в коде.</text>
</svg>
