name: desktop-windows

# Compiles the GrentuCode desktop shell into a real Windows installer (.exe)
# on a windows runner, where electron-builder needs no wine. Fires on any
# tag like v0.1.0-desktop, or manually via the Actions tab.
on:
  push:
    tags:
      - "v*-desktop"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build renderer + electron main
        run: |
          npm run build
          npm run electron:build

      - name: Package Windows installer + portable zip
        run: npx electron-builder --win nsis zip --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrentuCode-Windows
          path: |
            app/release/*.exe
            app/release/*.zip
          if-no-files-found: error
